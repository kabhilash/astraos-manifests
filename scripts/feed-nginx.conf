# nginx config for the dev rpm feed served by `scripts/build publish`.
# Mounted read-only into the astraos-feed container; the feed root
# (<machine>/<build-id>/ snapshots plus a <machine>/main symlink) is the
# document root.
server {
    listen 80;
    root /usr/share/nginx/html;
    autoindex on;

    location ~ /astrax-manifest\.json$ {
        add_header Cache-Control "no-cache";
    }
}
